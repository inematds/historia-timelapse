<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --amb:#FACC15; --ink:#0c0c10; }
  html,body { margin:0; width:1920px; height:1080px; overflow:hidden; background:#9fc3dc; }
  #ceu { position:absolute; inset:0; background:linear-gradient(#7fb0d6 0%, #b9d4e6 38%, #dfe8e2 60%, #dfe8e2 100%); }
  #mapa { position:absolute; inset:0; }
  #nevoa { position:absolute; inset:0; pointer-events:none;
    background:linear-gradient(rgba(214,228,236,1) 0%, rgba(214,228,236,.92) 14%, rgba(214,228,236,.4) 28%, rgba(214,228,236,0) 42%); }
  #tom { position:absolute; inset:0; pointer-events:none; mix-blend-mode:multiply; opacity:0; }
  .sombra { text-shadow:0 2px 6px rgba(0,0,0,.65), 0 0 2px rgba(0,0,0,.8); }
  #reg { position:absolute; left:56px; top:48px; display:flex; align-items:center; gap:18px; color:#fff;
    font:700 34px Inter; opacity:1; }
  #reg img { width:84px; height:56px; object-fit:cover; box-shadow:0 2px 10px rgba(0,0,0,.45); border-radius:3px; }
  #tempo { position:absolute; right:60px; top:40px; text-align:right; color:#fff; }
  #ano { font:800 64px Sora; letter-spacing:-.01em; line-height:1; }
  #ano small { font:600 30px Sora; opacity:.85; margin-right:10px; }
  #pop { font:700 36px Inter; margin-top:10px; font-variant-numeric:tabular-nums; }
  #pop span { font:600 22px Inter; opacity:.85; margin-left:8px; }
  #faixa { position:absolute; left:0; right:0; bottom:0; height:340px; pointer-events:none; opacity:0;
    background:linear-gradient(rgba(12,12,16,0), rgba(12,12,16,.72) 55%, rgba(12,12,16,.85)); }
  #popf { font:600 22px Inter; opacity:.8; margin-top:6px; }
  #fimt { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; color:#fff; opacity:0; }
  #fimt .t { font:800 84px Sora; } #fimt .s { font:600 30px Inter; opacity:.85; margin-top:14px; }
  #cartao { position:absolute; left:0; right:0; bottom:70px; text-align:center; color:#fff; opacity:0; }
  #cartao .t { font:800 66px Sora; letter-spacing:.01em; text-transform:uppercase; }
  #cartao .t b { color:var(--amb); font-weight:800; }
  #cartao .l { font:600 30px Inter; margin-top:10px; }
  #cartao .f { font:600 24px Inter; opacity:.85; margin-top:8px; }
  #capa { position:absolute; inset:0; display:flex; flex-direction:column; justify-content:center; padding-left:110px;
    color:#fff; opacity:0; background:linear-gradient(90deg, rgba(12,12,16,.78) 0%, rgba(12,12,16,.35) 55%, rgba(12,12,16,0) 80%); }
  #capa .k { font:700 30px Inter; letter-spacing:.18em; text-transform:uppercase; opacity:.9; }
  #capa .t { font:800 118px/1.0 Sora; letter-spacing:-.02em; margin-top:18px; max-width:1100px; }
  #capa .t b { color:var(--amb); }
  #capa .s { font:600 36px Inter; margin-top:26px; max-width:980px; }
  #marca { position:absolute; right:60px; bottom:40px; color:#fff; font:700 22px Sora; opacity:.85; }
  #marca i { color:var(--amb); font-style:normal; }
</style>
<script src="assets/deck.min.js"></script>
<script src="cena.js"></script>
</head><body>
<div id="ceu"></div><div id="mapa"></div><div id="nevoa"></div><div id="tom"></div>
<div id="reg" class="sombra"><span id="bandeira"></span><span id="regnome"></span></div>
<div id="tempo" class="sombra"><div id="ano"></div><div id="pop"></div><div id="popf">fonte: IBGE e estimativas históricas</div></div>
<div id="faixa"></div>
<div id="cartao" class="sombra"><div class="t"></div><div class="l"></div><div class="f"></div></div>
<div id="capa"><div class="k"></div><div class="t"></div><div class="s"></div></div>
<div id="fim" style="position:absolute;inset:0;background:#0c0c10;opacity:0"></div>
<div id="fimt"><div class="t">Porto Alegre</div><div class="s">1772 – 2024</div></div>
<div id="marca" class="sombra">INEMA<i>.</i>CLUB</div>
<script>
const C = window.CENA;
const EXZ = C.exz || 1.6, EXB = C.exb || 1.5;
const lerp = (a, b, k) => a + (b - a) * k;
const ease = k => k < 0 ? 0 : k > 1 ? 1 : k * k * (3 - 2 * k);

// interpolação por chaves [[t, valor], ...] — valor número ou objeto de números
function chave(lista, t, suave = true) {
  if (t <= lista[0][0]) return lista[0][1];
  for (let i = 0; i < lista.length - 1; i++) {
    const [t0, a] = lista[i], [t1, b] = lista[i + 1];
    if (t <= t1) {
      const k0 = (t - t0) / (t1 - t0), k = suave ? ease(k0) : k0;
      if (typeof a === 'number') return lerp(a, b, k);
      const o = {}; for (const c in a) o[c] = lerp(a[c], b[c], k); return o;
    }
  }
  return lista[lista.length - 1][1];
}
const anoEm = t => chave(C.anos, t, false);
function popEm(ano) {
  const p = C.pop; if (ano <= p[0][0]) return p[0][1];
  for (let i = 0; i < p.length - 1; i++) if (ano <= p[i + 1][0]) {
    const k = (ano - p[i][0]) / (p[i + 1][0] - p[i][0]);
    return p[i][1] * Math.pow(p[i + 1][1] / p[i][1], k);   // crescimento geométrico entre censos
  }
  return p[p.length - 1][1];
}
// teto de altura por época: cidade baixa até 1900, verticaliza depois
const tetoEm = ano => chave([[1700, 9], [1900, 10], [1930, 24], [1950, 45], [1975, 120], [2000, 180]], ano, false);

const fmt = n => Math.round(n).toLocaleString('pt-BR');
const buf = async f => (await fetch('assets/' + f)).arrayBuffer();
let mapa, D = {}, tAtual = 0, aguardando = null, tetoAtual = -1;

async function carrega() {
  D.T = await (await fetch('assets/terreno.json')).json();
  D.F = await (await fetch('assets/efeitos.json')).json();
  const POS = new Float32Array(await buf('pred_pos.f32'));
  const INI = new Uint32Array(await buf('pred_ini.u32'));
  D.ALT = new Float32Array(await buf('pred_alt.f32'));
  const ANO = new Float32Array(await buf('pred_ano.f32'));
  const n = D.ALT.length, nv = POS.length / 3;
  for (let i = 2; i < POS.length; i += 3) POS[i] *= EXZ;
  const anoV = new Float32Array(nv), cor = new Uint8Array(nv * 3);
  for (let p = 0; p < n; p++) {
    const h = ((p * 2654435761) >>> 0) / 4294967296;            // variação estável por prédio
    const alto = Math.min(1, D.ALT[p] / 40);
    const c = [lerp(226, 238, h) + alto * 10, lerp(122, 150, h) + alto * 70, lerp(58, 82, h) + alto * 80];
    for (let v = INI[p]; v < INI[p + 1]; v++) { anoV[v] = ANO[p]; cor.set(c, v * 3); }
  }
  D.pred = { length: n, startIndices: INI,
    attributes: { getPolygon: { value: POS, size: 3 }, getFillColor: { value: cor, size: 3 },
                  getFilterValue: { value: anoV, size: 1 } } };
}

const luz = new deck.LightingEffect({
  amb: new deck.AmbientLight({ color: [255, 255, 255], intensity: 1.0 }),
  sol: new deck.DirectionalLight({ color: [255, 244, 228], intensity: 1.6, direction: [-2, -3, -4] }),
});

function camadas(t) {
  const ano = anoEm(t), teto = Math.round(tetoEm(ano) * 2) / 2;
  const L = [];
  const [w0, s0, e0, n0] = D.T.bbox;
  L.push(new deck.SolidPolygonLayer({ id: 'chao-longe', data: [[[w0 - 1, s0 - 1, -3], [e0 + 1, s0 - 1, -3], [e0 + 1, n0 + 1, -3], [w0 - 1, n0 + 1, -3]]],
    getPolygon: d => d, getFillColor: [150, 172, 168], material: false, shadowEnabled: false }));
  L.push(new deck.TerrainLayer({ id: 'terreno', elevationData: 'assets/elev.png', texture: 'assets/textura.jpg',
    bounds: D.T.bbox, meshMaxError: 1.2,
    elevationDecoder: { rScaler: 256 * EXZ, gScaler: EXZ, bScaler: EXZ / 256, offset: -32768 * EXZ },
    operation: 'terrain+draw',
    loadOptions: { terrain: { workerUrl: location.origin + '/assets/terrain-worker.js', skirtHeight: 40 } }, material: { ambient: .5, diffuse: .55, shininess: 4 } }));
  L.push(new deck.SolidPolygonLayer({ id: 'predios', data: D.pred, _normalize: false, extruded: true,
    getElevation: (_, { index }) => Math.min(D.ALT[index], teto) * EXB,
    updateTriggers: { getElevation: teto },
    material: { ambient: .72, diffuse: .5, shininess: 12, specularColor: [40, 40, 40] },
    extensions: [new deck.DataFilterExtension({ filterSize: 1 })],
    filterRange: [1500, ano], filterSoftRange: [1500, ano - (C.nascer || 2.5)] }));
  // aterro da Praia de Belas: água até ano0, vira terra até ano1
  if (C.aterro && ano < C.aterro.ano1) {
    const k = ano <= C.aterro.ano0 ? 1 : 1 - (ano - C.aterro.ano0) / (C.aterro.ano1 - C.aterro.ano0);
    L.push(new deck.SolidPolygonLayer({ id: 'aterro', data: D.F.aterro, getPolygon: d => d,
      getFillColor: [52, 98, 132, Math.round(235 * k)], extensions: [new deck._TerrainExtension()], material: false,
      updateTriggers: { getFillColor: Math.round(k * 50) } }));
  }
  // Muro da Mauá: sobe de 1971 a 1974; destaque amarelo no cartão
  if (ano >= 1971) {
    const h = Math.min(1, (ano - 1971) / 3) * (C.muroAlt || 14);
    const dest = (C.muroDestaque || []).some(([a, b]) => t >= a && t <= b);
    L.push(new deck.SolidPolygonLayer({ id: 'muro', data: D.F.muro, getPolygon: d => d.map(p => [p[0], p[1], p[2] * EXZ]),
      extruded: true, getElevation: h, getFillColor: dest ? [250, 204, 21] : [205, 205, 198],
      updateTriggers: { getElevation: h, getFillColor: dest }, material: { ambient: .7, diffuse: .5 } }));
  }
  // tropas: pontos em anel em volta da cidade
  for (const tr of (C.tropas || [])) {
    if (t < tr.t0 || t > tr.t1) continue;
    const o = Math.min(1, (t - tr.t0) / .8, (tr.t1 - t) / .8);
    if (!tr._pts) { tr._pts = []; let sd = 7; const rnd = () => (sd = (sd * 16807) % 2147483647) / 2147483647;
      for (let i = 0; i < tr.n; i++) { const a = tr.a0 + (tr.a1 - tr.a0) * rnd(), r = tr.raio_km * (0.85 + 0.3 * rnd());
        tr._pts.push([tr.lon + r * Math.cos(a) / 96.3, tr.lat + r * Math.sin(a) / 111]); } }
    const ap = Math.min(1, (t - tr.t0) / 2.5);   // cerco fecha
    L.push(new deck.ScatterplotLayer({ id: 'tropas-' + tr.t0, data: tr._pts.slice(0, Math.ceil(tr._pts.length * ap)),
      getPosition: d => d, getRadius: tr.r || 28, getFillColor: [...(tr.cor || [200, 40, 30]), Math.round(255 * o)],
      radiusMinPixels: 2.5, extensions: [new deck._TerrainExtension()], updateTriggers: { getFillColor: o } }));
  }
  for (const e of (C.cheias || [])) {
    if (t < e.t0 || t > e.t1) continue;
    const nivel = chave(e.nivel, t);
    const [W, S, E, N] = D.T.bbox, z = (nivel + (C.ajusteAgua ?? 0.5)) * EXZ;
    L.push(new deck.SolidPolygonLayer({ id: 'cheia-' + e.t0, data: [[[W - 1, S - 1, z], [E + 1, S - 1, z], [E + 1, N + 1, z], [W - 1, N + 1, z]]],
      getPolygon: d => d, getFillColor: e.cor || [38, 112, 178, 238], material: false, shadowEnabled: false }));
  }
  const rot = (C.rotulos || []).filter(r => ano >= (r.de ?? -9e9) && ano <= (r.ate ?? 9e9) && t >= (r.t0 ?? -1) && t <= (r.t1 ?? 9e9));
  if (rot.length) L.push(new deck.TextLayer({ id: 'rotulos', data: rot, getPosition: r => [r.lon, r.lat, (r.z || 20) * EXZ],
    getText: r => r.texto, getSize: r => r.tam || 30, getColor: r => r.cor || [255, 255, 255],
    fontFamily: 'Inter', fontWeight: 700, characterSet: 'auto', fontSettings: { sdf: true, fontSize: 64, buffer: 8 },
    outlineWidth: 4, outlineColor: [0, 0, 0, 170], billboard: true, shadowEnabled: false, getTextAnchor: 'middle', getAlignmentBaseline: 'center' }));
  return L;
}

const BANDEIRAS = {
  portugal: `<svg viewBox="0 0 90 60"><rect width="90" height="60" fill="#f4f4f0"/><circle cx="45" cy="30" r="15" fill="none" stroke="#c9a227" stroke-width="3"/><rect x="39" y="20" width="12" height="18" rx="2" fill="#2a4d9b"/><path d="M39 20 h12 v-5 h-12z" fill="#c9a227"/></svg>`,
  reino: `<svg viewBox="0 0 90 60"><rect width="90" height="60" fill="#f4f4f0"/><circle cx="45" cy="30" r="16" fill="#2a4d9b"/><circle cx="45" cy="30" r="12" fill="none" stroke="#c9a227" stroke-width="3"/><path d="M38 14 h14 v-6 h-14z" fill="#c9a227"/></svg>`,
  imperio: `<svg viewBox="0 0 90 60"><rect width="90" height="60" fill="#1f7a3a"/><path d="M45 6 L84 30 L45 54 L6 30z" fill="#f2c318"/><rect x="38" y="20" width="14" height="20" rx="3" fill="#1f7a3a" stroke="#fff" stroke-width="1.5"/><path d="M38 20 h14 v-6 h-14z" fill="#c9a227"/></svg>`,
  republica: `<svg viewBox="0 0 90 60"><rect width="90" height="60" fill="#1f8a3e"/><path d="M45 6 L84 30 L45 54 L6 30z" fill="#f7d117"/><circle cx="45" cy="30" r="12" fill="#1a3a8a"/><path d="M33 28 Q45 23 57 31" stroke="#fff" stroke-width="2" fill="none"/></svg>`,
};

function html(t) {
  const ano = anoEm(t);
  document.getElementById('ano').innerHTML = `<small>ano</small>${Math.floor(ano)}`;
  document.getElementById('pop').innerHTML = `${fmt(popEm(ano))}<span>habitantes</span>`;
  document.getElementById('popf').textContent = ano >= 2022 ? 'último censo: 2022 · fonte: IBGE' : 'fonte: IBGE e estimativas históricas';
  const r = [...C.regimes].reverse().find(x => ano >= x.ano) || C.regimes[0];
  if (document.getElementById('regnome').textContent !== r.nome) {
    document.getElementById('regnome').textContent = r.nome;
    document.getElementById('bandeira').innerHTML = `<img src="assets/bandeiras/${r.bandeira}.svg">`;
  }
  const cart = document.getElementById('cartao');
  const c = (C.cartoes || []).find(x => t >= x.t0 && t <= x.t1);
  if (c) {
    cart.querySelector('.t').innerHTML = c.titulo; cart.querySelector('.l').textContent = c.legenda || '';
    cart.querySelector('.f').textContent = c.fonte ? 'Fonte: ' + c.fonte : '';
    cart.style.opacity = Math.min(1, (t - c.t0) / .5, (c.t1 - t) / .5);
  } else cart.style.opacity = 0;
  document.getElementById('faixa').style.opacity = cart.style.opacity;
  const cap = document.getElementById('capa'), k = C.capa;
  if (k && t <= k.t1) {
    cap.querySelector('.k').textContent = k.kicker || ''; cap.querySelector('.t').innerHTML = k.titulo;
    cap.querySelector('.s').textContent = k.sub || '';
    cap.style.opacity = Math.min(1, (k.t1 - t) / .6);
    for (const id of ['reg', 'tempo']) document.getElementById(id).style.opacity = 1 - Math.min(1, (k.t1 - t) / .6);
  } else { cap.style.opacity = 0; for (const id of ['reg', 'tempo']) document.getElementById(id).style.opacity = 1; }
  const kf = Math.max(0, Math.min(1, (t - (C.duracao - 3.2)) / 1.0));
  document.getElementById('fim').style.opacity = kf;
  document.getElementById('fimt').style.opacity = Math.max(0, Math.min(kf, (C.duracao - 0.2 - t) / 0.6));
  const tom = document.getElementById('tom'), f = (C.tons || []).find(x => t >= x.t0 && t <= x.t1);
  if (f) { tom.style.background = f.cor; tom.style.opacity = f.forca * Math.min(1, (t - f.t0) / .8, (f.t1 - t) / .8); }
  else tom.style.opacity = 0;
}

window.render = t => new Promise(res => {
  tAtual = t; aguardando = res;
  const v = chave(C.cam, t);
  mapa.setProps({ viewState: { longitude: v.lon, latitude: v.lat, zoom: v.zoom, pitch: v.pitch, bearing: v.bearing },
                  layers: camadas(t) });
  mapa.redraw(true);
});

window.pronto = (async () => {
  await Promise.all([document.fonts.load('700 40px Inter'), document.fonts.load('800 60px Sora'), document.fonts.load('600 30px Inter')]);
  await carrega();
  mapa = new deck.Deck({ parent: document.getElementById('mapa'), width: 1920, height: 1080, controller: false,
    useDevicePixels: 1, effects: [luz], initialViewState: { longitude: -51.2, latitude: -30.05, zoom: 11, pitch: 50 },
    parameters: { clearColor: [0, 0, 0, 0] }, layers: camadas(0),
    onAfterRender: () => { if (!aguardando) return; const r = aguardando; aguardando = null; html(tAtual); requestAnimationFrame(() => r(true)); } });
  await new Promise(r => { const iv = setInterval(() => {
    const l = mapa.isInitialized && mapa.layerManager && mapa.layerManager.getLayers().find(x => x.id === 'terreno');
    if (l && l.isLoaded) { clearInterval(iv); r(); } }, 100); });
  await Promise.all([...new Set(C.regimes.map(r => r.bandeira))].map(b => new Promise(r => { const i = new Image(); i.onload = i.onerror = r; i.src = `assets/bandeiras/${b}.svg`; })));
  await document.fonts.ready;
  return true;
})();
</script></body></html>
